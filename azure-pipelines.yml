trigger: none

schedules:
  - cron: "0 6 * * *"        # Her gГјn 06:00 UTC
    displayName: РЎРµРґРјРёС‡РЅРё E2E С‚РµСЃС‚РѕРІРµ
    branches:
      include:
        - main
    always: true

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
    displayName: 'РРЅСЃС‚Р°Р»РёСЂР°Р№ Node.js'

  - script: npm ci
    displayName: 'РРЅСЃС‚Р°Р»РёСЂР°Р№ Р·Р°РІРёСЃРёРјРѕСЃС‚Рё'

  - script: npm run test:unit
    displayName: 'РџСѓСЃРЅРё unit С‚РµСЃС‚РѕРІРµС‚Рµ'

  - script: npx playwright install --with-deps chromium
    displayName: 'РРЅСЃС‚Р°Р»РёСЂР°Р№ Playwright Р±СЂР°СѓР·СЉСЂРё'

  - script: npx playwright test --project=chromium --reporter=list,junit
    displayName: 'РџСѓСЃРЅРё E2E С‚РµСЃС‚РѕРІРµС‚Рµ'
    env:
      PLAYWRIGHT_JUNIT_OUTPUT_NAME: 'test-results/results.xml'
      VITE_SUPABASE_URL: $(VITE_SUPABASE_URL)
      VITE_SUPABASE_PUBLISHABLE_KEY: $(VITE_SUPABASE_PUBLISHABLE_KEY)
      SUPABASE_SERVICE_ROLE_KEY: $(SUPABASE_SERVICE_ROLE_KEY)
      E2E_PASSWORD: $(E2E_PASSWORD)
      E2E_ADMIN_PASSWORD: $(E2E_ADMIN_PASSWORD)
      VITE_STRIPE_PUBLISHABLE_KEY: $(VITE_STRIPE_PUBLISHABLE_KEY)
      VITE_SITE_URL: 'http://localhost:8080'

  - task: PublishTestResults@2
    condition: always()
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: 'test-results/**/*.xml'
      testRunTitle: 'Playwright E2E'
    displayName: 'РџСѓР±Р»РёРєСѓРІР°Р№ СЂРµР·СѓР»С‚Р°С‚РёС‚Рµ'