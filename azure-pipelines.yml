trigger: none

schedules:
  - cron: "0 6 * * *"        # every day 06:00 UTC
    displayName: Daily E2E tests
    branches:
      include:
        - main
    always: true

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
    displayName: 'Install Node.js'

  - script: npm ci
    displayName: 'Install dependencies'

  - script: npm run test:unit
    displayName: 'Run unit tests'

  # Safety: the tests must never run against the live Supabase project.
  # (tests/load-env.ts checks this too; this step stops the run even earlier.)
  - script: |
      if [ -z "$SUPABASE_URL" ]; then echo "VITE_SUPABASE_URL is not set"; exit 1; fi
      case "$SUPABASE_URL" in
        *fznhblkjgdghpwsdgiit*) echo "VITE_SUPABASE_URL points at the LIVE project. Stopping."; exit 1;;
      esac
      echo "Test project OK"
    displayName: 'Check: test project only'
    env:
      SUPABASE_URL: $(VITE_SUPABASE_URL)

  - script: npx playwright install --with-deps chromium
    displayName: 'Install Playwright browsers'

  - script: npx playwright test --project=chromium --reporter=list,junit
    displayName: 'Run E2E and API tests'
    env:
      PLAYWRIGHT_JUNIT_OUTPUT_NAME: 'test-results/results.xml'
      VITE_SUPABASE_URL: $(VITE_SUPABASE_URL)
      VITE_SUPABASE_PUBLISHABLE_KEY: $(VITE_SUPABASE_PUBLISHABLE_KEY)
      SUPABASE_SERVICE_ROLE_KEY: $(SUPABASE_SERVICE_ROLE_KEY)
      E2E_PASSWORD: $(E2E_PASSWORD)
      E2E_ADMIN_PASSWORD: $(E2E_ADMIN_PASSWORD)
      VITE_STRIPE_PUBLISHABLE_KEY: $(VITE_STRIPE_PUBLISHABLE_KEY)
      VITE_SITE_URL: 'http://localhost:8080'

  - task: PublishTestResults@2
    condition: always()
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: 'test-results/**/*.xml'
      testRunTitle: 'Playwright E2E'
    displayName: 'Publish test results'